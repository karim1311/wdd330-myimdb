<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyIMDb | Home</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script type="module" src="/js/main.js"></script>
  </head>

  <body>
    <section id="alertHolder">
      <!-- Alert Template -->
      <template id="atemp">
        <section>
          <p></p>
        </section>
      </template>
    </section>

    <header id="main-header" class="divider"></header>
    <main class="divider">
      <section class="product-categories">
        <div class="category-grid">
          <a href="/product_listing/?category=tents" class="category-item">
            <img src="/images/category-tents.svg" alt="Tents">
            <span>Movies</span>
          </a>
          <a href="/product_listing/?category=backpacks" class="category-item">
            <img src="/images/category-backpacks.svg" alt="Backpacks">
            <span>TV Shows</span>
          </a>
        </div>
      </section>
      <section class="products">
        <h2>Popular Movies</h2>
        <ul class="product-list"></ul>
      </section>
      <section class="products">
        <h2>Popular TV Shows</h2>
        <ul class="tv-list"></ul>
      </section>
    </main>
    <footer id="main-footer"></footer>
  </body>
</html>
